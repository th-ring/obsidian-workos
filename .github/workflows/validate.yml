name: Validate Vault Schemas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JSON Schemas
        run: |
          node -e "
          const fs = require('fs');
          const schemas = fs.readdirSync('.schemas').filter(f => f.endsWith('.json'));
          schemas.forEach(s => {
            const content = fs.readFileSync('.schemas/' + s, 'utf8');
            JSON.parse(content);
            console.log('Valid schema:', s);
          });
          console.log('All schemas valid!');
          "
